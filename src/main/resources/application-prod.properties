# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT

# CORS - Permitir Vercel
app.cors.allowed-origins=${CORS_ORIGINS:https://roomiohub-frontend.vercel.app,http://localhost:4200}

# Logging
logging.level.com.roomiohub=INFO

# JWT Configuration
app.jwt.secret=${JWT_SECRET:roomiohubSecretKey2024With256BitsLength!}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}