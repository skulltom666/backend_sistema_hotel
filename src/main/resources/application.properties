# Usar base de datos PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/roomiohub_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.application.name=sistemahotelero


# Puerto

# Formato de fechas para no tener problemas con las transacciones
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss


# Configuración de JWT
app.jwt.secret=roomiohubSecretKey2024With256BitsLength!
app.jwt.expiration-ms=86400000

# Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=http://localhost:4200,https://roomiohub-frontend.vercel.app

# Server
server.port=8080