# Base de datos H2 en memoria para las pruebas unitarias y de integración
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.application.name=sistemahotelero-test

# Puerto
server.port=8080

# Formato de fechas para no tener problemas con las transacciones
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Configuración de JWT
app.jwt.secret=roomiohubSecretKey2024With256BitsLength!
app.jwt.expiration-ms=86400000

# Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
app.cors.allowed-origins=http://localhost:4200

# Logging
logging.level.org.springframework.test=INFO
logging.level.com.hotel.sistemahotelero=DEBUG