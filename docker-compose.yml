version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: hotel_db
    environment:
      POSTGRES_DB: roomiohub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
